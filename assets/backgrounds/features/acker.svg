<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <!-- Solid field strip — fully opaque, content fills from top to bottom after trim -->
  <rect x="0" y="40" width="800" height="160" fill="#C4A574"/>
  <rect x="0" y="40" width="800" height="12" fill="#A88840"/>
  <!-- Furrow lines -->
  <g stroke="#A08050" stroke-width="3" fill="none">
    <path d="M0,70 Q100,65 200,72 T400,70 T600,75 T800,68"/>
    <path d="M0,100 Q120,95 240,102 T480,100 T720,105 T800,98"/>
    <path d="M0,130 Q90,125 200,132 T400,130 T600,135 T800,128"/>
    <path d="M0,160 Q130,155 250,162 T500,160 T720,165 T800,158"/>
  </g>
  <!-- Scarecrow on the field (bottom of pole on field surface) -->
  <g transform="translate(400,0)">
    <rect x="-3" y="20" width="6" height="55" fill="#6D4C41"/>
    <rect x="-25" y="30" width="50" height="8" fill="#8D6E63"/>
    <circle cx="0" cy="15" r="12" fill="#E8D5B0"/>
    <polygon points="-14,5 0,-5 14,5" fill="#C62828"/>
  </g>
</svg>
