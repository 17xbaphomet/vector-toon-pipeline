<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400">
  <!-- Opaque ground across full plane under buildings -->
  <rect x="0" y="350" width="320" height="50" fill="#6B8E4E"/>
  <rect x="0" y="350" width="320" height="10" fill="#7A9B5A"/>
  <!-- walls sit flush on ground (bottom at y=350) -->
  <rect x="50" y="245" width="130" height="105" fill="#EFEBE9" stroke="#8D6E63" stroke-width="1"/>
  <polygon points="40,245 115,180 190,245" fill="#BF360C"/>
  <rect x="95" y="285" width="30" height="65" fill="#5D4037"/>
  <rect x="65" y="265" width="22" height="18" fill="#81D4FA"/>
  <rect x="140" y="265" width="22" height="18" fill="#81D4FA"/>
  <rect x="185" y="265" width="90" height="85" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1"/>
  <polygon points="180,265 230,215 280,265" fill="#6D4C41"/>
  <rect x="215" y="295" width="25" height="55" fill="#5D4037"/>
</svg>
