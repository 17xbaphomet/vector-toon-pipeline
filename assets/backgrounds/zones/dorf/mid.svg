<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <!-- Soft hills behind village -->
  <path d="M0,300 Q400,270 800,295 T1600,280 L1600,480 L0,480 Z" fill="#9BC47A"/>
  <!-- Village houses row -->
  <!-- House 1 -->
  <g transform="translate(80,240)">
    <rect x="10" y="40" width="70" height="55" fill="#E8D5B0" stroke="#8D6E63" stroke-width="1"/>
    <polygon points="5,40 45,5 85,40" fill="#C45C4A" stroke="#8B3A2E" stroke-width="1"/>
    <rect x="35" y="60" width="16" height="30" fill="#5D4037"/>
    <rect x="18" y="50" width="12" height="12" fill="#81D4FA"/>
    <rect x="58" y="50" width="12" height="12" fill="#81D4FA"/>
  </g>
  <!-- House 2 church -->
  <g transform="translate(280,200)">
    <rect x="20" y="50" width="50" height="90" fill="#D7CCC8" stroke="#78716C" stroke-width="1"/>
    <polygon points="15,50 45,10 75,50" fill="#78716C"/>
    <rect x="38" y="0" width="14" height="40" fill="#A8A29E"/>
    <polygon points="35,0 45,-18 55,0" fill="#57534E"/>
    <rect x="35" y="100" width="18" height="35" fill="#44403C"/>
    <circle cx="45" cy="70" r="8" fill="#FDE68A" opacity="0.6"/>
  </g>
  <!-- House 3 -->
  <g transform="translate(480,250)">
    <rect x="5" y="30" width="90" height="50" fill="#F5E6D3" stroke="#A1887F" stroke-width="1"/>
    <polygon points="0,30 50,0 100,30" fill="#8D6E63"/>
    <rect x="40" y="50" width="18" height="28" fill="#5D4037"/>
    <rect x="15" y="42" width="14" height="12" fill="#B3E5FC"/>
    <rect x="70" y="42" width="14" height="12" fill="#B3E5FC"/>
  </g>
  <!-- House 4 -->
  <g transform="translate(720,245)">
    <rect x="10" y="35" width="65" height="50" fill="#EFEBE9" stroke="#8D6E63" stroke-width="1"/>
    <polygon points="5,35 42,5 80,35" fill="#A1887F"/>
    <rect x="32" y="55" width="16" height="28" fill="#4E342E"/>
    <rect x="18" y="45" width="10" height="10" fill="#81D4FA"/>
    <rect x="55" y="45" width="10" height="10" fill="#81D4FA"/>
  </g>
  <!-- House 5 -->
  <g transform="translate(980,235)">
    <rect x="5" y="40" width="80" height="55" fill="#DCEDC8" stroke="#7CB342" stroke-width="1"/>
    <polygon points="0,40 45,5 90,40" fill="#558B2F"/>
    <rect x="35" y="60" width="18" height="32" fill="#5D4037"/>
    <rect x="15" y="50" width="12" height="12" fill="#E1F5FE"/>
    <rect x="60" y="50" width="12" height="12" fill="#E1F5FE"/>
  </g>
  <!-- House 6 -->
  <g transform="translate(1250,248)">
    <rect x="8" y="32" width="75" height="52" fill="#FFF3E0" stroke="#A1887F" stroke-width="1"/>
    <polygon points="3,32 45,0 88,32" fill="#BF360C"/>
    <rect x="35" y="55" width="16" height="27" fill="#4E342E"/>
    <rect x="16" y="42" width="12" height="11" fill="#81D4FA"/>
    <rect x="58" y="42" width="12" height="11" fill="#81D4FA"/>
  </g>
  <!-- Trees between houses -->
  <g fill="#558B2F">
    <ellipse cx="220" cy="280" rx="18" ry="35"/><rect x="216" y="300" width="8" height="20" fill="#5D4037"/>
    <ellipse cx="650" cy="275" rx="20" ry="38"/><rect x="646" y="298" width="8" height="22" fill="#5D4037"/>
    <ellipse cx="900" cy="282" rx="16" ry="32"/><rect x="896" y="300" width="8" height="18" fill="#5D4037"/>
    <ellipse cx="1180" cy="278" rx="19" ry="36"/><rect x="1176" y="298" width="8" height="20" fill="#5D4037"/>
  </g>
</svg>
